name: Single recipient sender name test

on:
  push:
    branches: [codex/sender-name-test-20261120-0016]
    paths:
      - .github/workflows/sender-name-test-20261120.yml

permissions:
  contents: read

concurrency:
  group: sender-name-test-20261120-0016
  cancel-in-progress: false

jobs:
  test:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the reviewed email helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: de081501b255d01b3d88f78c992083ca52491116
          persist-credentials: false
      - name: Send one owner-only preview using the current sender settings
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, uuid
          sys.path.insert(0, 'scripts')
          from notify_email import BUTTONDOWN, request
          
          recipient = subprocess.check_output(
              ['git', 'show', '-s', '--format=%ae', 'de081501b255d01b3d88f78c992083ca52491116'],
              text=True).strip()
          if not re.fullmatch(r'[^\s@]+@[^\s@]+\.[^\s@]+', recipient):
              raise SystemExit('The approved owner email is unavailable.')
          api_key = os.environ['BUTTONDOWN_API_KEY']
          headers = {'Authorization': f'Token {api_key}'}
          identity = 'sender-name-check-20261120-0016'
          payload = {
              'subject': 'ethanv1 发件人名称确认测试（2026-11-20 00:16）',
              'slug': identity,
              'body': '<!-- buttondown-editor-mode: fancy --><p>这是一封单人测试邮件，用于确认发件人显示名称是否为 ethanv1。</p><p>此邮件通过网站现有的 Buttondown 发信服务发送。</p>',
              'status': 'draft',
              'archival_mode': 'disabled',
              'commenting_mode': 'disabled',
              'template': 'modern',
          }
          draft = json.loads(request(
              f'{BUTTONDOWN}/emails', method='POST', body=payload,
              headers={**headers, 'X-Idempotency-Key': str(uuid.uuid5(uuid.NAMESPACE_URL, identity))}))
          email_id = draft.get('id', '')
          if draft.get('status') != 'draft' or not re.fullmatch(r'[a-zA-Z0-9_-]{1,80}', email_id):
              raise SystemExit('A valid unsent draft was not confirmed; no send attempted.')
          request(f'{BUTTONDOWN}/emails/{email_id}/send-draft', method='POST',
                  headers=headers, body={'recipients': [recipient]})
          print('Buttondown accepted the single-recipient test preview. Draft ID:', email_id)
          PY
