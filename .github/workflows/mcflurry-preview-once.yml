name: McFlurry single-recipient preview

on:
  push:
    branches: [codex/mcflurry-email-preview-20261120-1717]
    paths: [.github/workflows/mcflurry-preview-once.yml]

permissions:
  contents: read

concurrency:
  group: mcflurry-single-preview-20261120-1717
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.head_commit.message == 'Send one McFlurry email preview'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out approved article and preview script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Send one preview to the registered mailbox
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 scripts/notify_email.py --article one-mcflurry.html --test-to ethansunv1@gmail.com
