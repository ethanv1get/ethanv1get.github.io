name: Email article notifications

on:
  workflow_run:
    workflows: [Publish ethan.]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ethan-email-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      vars.EMAIL_NOTIFY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Stores one reservation tag per notified article.
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Notify email subscribers about new articles
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          EMAIL_NOTIFY_ENABLED: ${{ vars.EMAIL_NOTIFY_ENABLED }}
          EMAIL_NOTIFY_BASE_SHA: ${{ vars.EMAIL_NOTIFY_BASE_SHA }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 scripts/notify_email.py
